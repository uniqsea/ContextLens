[project]
name = "contextlens-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.24",
    "fastembed==0.9.0",
    "httpx>=0.28,<0.29",
    "jieba==0.42.1",
    "langchain-openai>=1.7,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-cli[inmem]>=0.4,<0.5",
    "llama-index-core>=0.14.25,<0.15",
    "pillow>=12.3,<13",
    "python-dotenv>=1.0",
    "setproctitle>=1.3.7,<2",
    "sqlite-vec==0.1.9",
    "stop-words==2025.11.4",
    "tiktoken>=0.14,<1",
    "watchfiles>=1.3,<2",
]

[tool.uv]
# The app is run in place (langgraph dev, unittest), not installed.
package = false
# Resolve only releases at least two weeks old (supply-chain guard). Move forward deliberately.
exclude-newer = "2026-10-14T00:00:00Z"
